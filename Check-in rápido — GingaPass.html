<!DOCTYPE html>
<!-- saved from url=(0052)file:///C:/Users/rafael.souza/Downloads/checkin.html -->
<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in rápido — GingaPass</title>
<style>
  :root{
    --navy-900:#042C53; --navy-700:#0C447C; --amber-500:#EF9F27; --cream:#FBF3E4; --cream-2:#F4E8D0; --ink:#1B2733; --ink-soft:#5B6B7A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins','Inter',sans-serif;background:var(--navy-900);min-height:100vh;display:flex;justify-content:center;}
  .wrap{width:100%;max-width:420px;background:var(--cream);min-height:100vh;padding:28px 20px;}
  h1{color:var(--navy-900);font-size:22px;margin:0 0 4px;}
  p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  input, select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #E2D8C4;background:#fff;font-size:15px;margin-bottom:16px;font-family:inherit;}
  button{width:100%;padding:15px;border:none;border-radius:100px;background:var(--amber-500);color:var(--navy-900);font-weight:700;font-size:15px;cursor:pointer;}
  button:disabled{opacity:0.6;}
  .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(4,44,83,0.08);}
  .msg{text-align:center;padding:40px 10px;}
  .msg .icon{font-size:48px;margin-bottom:14px;}
  .msg h2{color:var(--navy-900);margin:0 0 8px;}
  .msg p{color:var(--ink-soft);font-size:14px;}
  .erro{color:#C0392B;font-size:13px;margin-top:-8px;margin-bottom:16px;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Check-in de treino</h1>
  <p class="sub" id="subtitulo">Confirme sua presença na aula de hoje</p>

  <div class="card" id="formBox" style="display: none;">
    <label>Seu nome completo</label>
    <input id="inputNome" placeholder="Nome completo">

    <label>Graduação / corda</label>
    <input id="inputGraduacao" placeholder="Ex: Corda Verde e Amarela">

    <label>De qual professor você é aluno?</label>
    <select id="inputProfessor"><option value="">Carregando professores...</option></select>

    <p class="erro" id="erroTexto"></p>
    <button id="btnEnviar" onclick="confirmarPresenca()">Confirmar presença</button>
  </div>

  <div class="msg" id="msgBox" style="display: block;">
    <div class="icon" id="msgIcon">⚠️</div>
    <h2 id="msgTitulo">Link inválido</h2>
    <p id="msgTexto">Esse link de check-in está incompleto. Peça pro professor gerar o QR code de novo.</p>
  </div>
</div>

<script src="./Check-in rápido — GingaPass_files/firebase-app-compat.js.baixados"></script>
<script src="./Check-in rápido — GingaPass_files/firebase-firestore-compat.js.baixados"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBY-di3U_GTkSrlfW18XIMS3KrvfFT0AGI",
  authDomain: "gingapass-app.firebaseapp.com",
  projectId: "gingapass-app",
  storageBucket: "gingapass-app.firebasestorage.app",
  messagingSenderId: "562987770081",
  appId: "1:562987770081:web:3654b9f0f9e1a6767817a0"
};

let db = null;
const params = new URLSearchParams(location.search);
const dataAula = params.get('data') || '';
const codigoAula = params.get('codigo') || '';

function mostrarErro(msg){
  const el = document.getElementById('erroTexto');
  el.textContent = msg;
  el.style.display = 'block';
}

function mostrarMensagemFinal(sucesso, titulo, texto){
  document.getElementById('formBox').style.display = 'none';
  document.getElementById('msgBox').style.display = 'block';
  document.getElementById('msgIcon').textContent = sucesso ? '✅' : '⚠️';
  document.getElementById('msgTitulo').textContent = titulo;
  document.getElementById('msgTexto').textContent = texto;
}

function dataFormatada(d){
  try{
    return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});
  } catch(e){ return d; }
}

function iniciar(tentativas){
  tentativas = tentativas || 0;
  if(typeof firebase === 'undefined'){
    if(tentativas < 30){
      setTimeout(function(){ iniciar(tentativas + 1); }, 500);
      return;
    }
    mostrarMensagemFinal(false, 'Sem conexão', 'Não conseguimos conectar. Verifique sua internet e recarregue a página.');
    return;
  }
  const app = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore(app);
  carregarDados();
}

async function carregarDados(){
  if(!dataAula || !codigoAula){
    mostrarMensagemFinal(false, 'Link inválido', 'Esse link de check-in está incompleto. Peça pro professor gerar o QR code de novo.');
    return;
  }

  document.getElementById('subtitulo').textContent = 'Aula de ' + dataFormatada(dataAula);

  try{
    const docCodigo = await db.collection('gingapass').doc('gingapass_qrcode_' + dataAula).get();
    if(!docCodigo.exists || docCodigo.data().value !== codigoAula){
      mostrarMensagemFinal(false, 'Código expirado', 'Esse QR code não é mais válido. Peça pro professor gerar um novo.');
      return;
    }
  } catch(e){
    mostrarMensagemFinal(false, 'Erro de conexão', 'Não conseguimos verificar o código. Tente novamente.');
    return;
  }

  try{
    const docRede = await db.collection('gingapass').doc('gingapass_rede_academias').get();
    const docContas = await db.collection('gingapass').doc('gingapass_academias_contas').get();
    const rede = docRede.exists ? JSON.parse(docRede.data().value || '[]') : [];
    const contas = docContas.exists ? JSON.parse(docContas.data().value || '[]') : [];
    const nomesComLogin = new Set(contas.map(c => c.nome));
    const professores = [...new Set(rede.filter(a => nomesComLogin.has(a.nome) && a.professor).map(a => a.professor.trim()).filter(Boolean))];

    const select = document.getElementById('inputProfessor');
    if(professores.length === 0){
      select.innerHTML = '<option value="">Nenhum professor cadastrado</option>';
    } else {
      select.innerHTML = '<option value="">Selecione o professor...</option>' +
        professores.map(p => '<option value="' + p + '">' + p + '</option>').join('');
    }
  } catch(e){
    document.getElementById('inputProfessor').innerHTML = '<option value="">Erro ao carregar professores</option>';
  }
}

async function confirmarPresenca(){
  const nome = document.getElementById('inputNome').value.trim();
  const graduacao = document.getElementById('inputGraduacao').value.trim();
  const professor = document.getElementById('inputProfessor').value;
  const btn = document.getElementById('btnEnviar');

  if(!nome){ mostrarErro('Digite seu nome completo.'); return; }
  if(!professor){ mostrarErro('Selecione de qual professor você é aluno.'); return; }
  document.getElementById('erroTexto').style.display = 'none';

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try{
    const chave = 'gingapass_checkin_avulso_' + dataAula;
    const doc = await db.collection('gingapass').doc(chave).get();
    const lista = doc.exists ? JSON.parse(doc.data().value || '[]') : [];
    lista.push({
      nome, graduacao, professor,
      hora: Date.now()
    });
    await db.collection('gingapass').doc(chave).set({value: JSON.stringify(lista), atualizado: Date.now()});
    mostrarMensagemFinal(true, 'Presença confirmada!', 'Bom treino, ' + nome.split(' ')[0] + '! 🥋');
  } catch(e){
    btn.disabled = false;
    btn.textContent = 'Confirmar presença';
    mostrarErro('Não conseguimos registrar agora. Verifique sua internet e tente de novo.');
  }
}

iniciar();
</script>


</body></html>
